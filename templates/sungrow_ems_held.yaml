# Sungrow EMS mode and command, held over failed Modbus reads. Read
# by the Zaptec fuse guard instead of the raw sensors. See
# sungrow_ems_held.md.
#
# Raw failed -> keep the last good value. The `for:` timers (warn
# 15 s, expire 25 s) sit between the 10 s polls; see
# sungrow_ems_held.md for why.
#
# Part of the merged `template:` list (see README.md for the
# file-format rules).

- trigger:
    - trigger: state
      entity_id: sensor.ems_mode_selection_raw
      to: ~
      id: change
    - trigger: state
      entity_id: sensor.ems_mode_selection_raw
      to: [unavailable, unknown]
      for: "00:00:15"
      id: warn
    - trigger: state
      entity_id: sensor.ems_mode_selection_raw
      to: [unavailable, unknown]
      for: "00:00:25"
      id: expire
    # A restored state is stale; show unavailable until a good read.
    - trigger: homeassistant
      event: start
      id: start
    - trigger: event
      event_type: event_template_reloaded
      id: start
  action:
    - if:
        - condition: trigger
          id: warn
      then:
        - action: system_log.write
          data:
            level: warning
            logger: fuse_guard.hold
            message: >-
              sensor.ems_mode_selection_raw failed two polls in a
              row; the fuse guard holds its last good value for one
              more poll.
  sensor:
    - name: "EMS mode selection raw held"
      unique_id: ems_mode_selection_raw_held
      icon: mdi:battery-sync
      state: >
        {% set raw = states('sensor.ems_mode_selection_raw') %}
        {{ raw if raw not in ['unavailable', 'unknown'] else this.state }}
      availability: >
        {{ states('sensor.ems_mode_selection_raw') not in ['unavailable', 'unknown']
           or (trigger.id in ['change', 'warn']
               and this.state not in ['unavailable', 'unknown']) }}

