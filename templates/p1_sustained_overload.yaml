# P1 sustained overload
# =====================
# The Zaptec fuse guard (automations/zaptec/Dynamic_fuse_protection.yaml)
# ignores the 1KOMMA5 optimiser's battery grid charge while the
# optimiser is in control, on the premise that the battery yields to
# the car. This sensor is the guard's check that it actually did.
#
# The optimiser settles at about 25.6 A on the highest phase and clears
# a spike within ~30 s, so 27 A held for 60 s means it is not yielding.
# delay_off keeps the guard on full battery accounting for 60 min
# afterwards, so the fuse cools down before the discount is tried
# again. The guard keeps retrying after every quiet period by design
# (no latch); Overload_notify.yaml notifies each time this turns on.
#
# Reads the RAW P1 phases. No availability template: an unavailable
# P1 reads 0 here, and the guard's own P1 liveness check
# (failsafe_other) covers P1 loss.
#
# Part of the merged `template:` list (see README.md for the
# file-format rules).

- binary_sensor:
    - name: "P1 sustained overload"
      unique_id: p1_sustained_overload
      device_class: problem
      delay_on: "00:01:00"
      delay_off: "01:00:00"
      state: >
        {{ [ states('sensor.p1_meter_strom_fas_1')|float(0),
             states('sensor.p1_meter_strom_fas_2')|float(0),
             states('sensor.p1_meter_strom_fas_3')|float(0) ]|max >= 27 }}
