prometheus:
  filter:
    include_domains:
      - climate
      - humidifier
    include_entities:
      # Nordpool prices
      - sensor.nord_pool_se3_aktuellt_pris
      # Electric current P1 import
      - sensor.p1_meter_strom_fas_*
      # Energy P1 import
      - sensor.p1_meter_total_elimport
      # Zaptec EV charger - for the charging dashboard
      - sensor.zag064494_strom_fas_*             # actual current per phase
      - sensor.zag064494_tilldelad_laddstrom     # allocated current
      - number.zag064494_max_laddstrom           # configured max (control output)
      - sensor.zag064494_laddeffekt              # charging power
      - sensor.zag064494_laddat_denna_sessionen  # energy this session
      # Energy consumption
      - sensor.daikinap24848_energiforbrukning
      - sensor.*_energi
      - sensor.*_energi_*
      # Dehumidifiers - Storage outside
      - fan.avfuktare
      - sensor.avfuktare_luftfuktighet
      # Dehumidifiers - Otto Storage inside
      - binary_sensor.otto_dehumidifier_tank_full
      - sensor.otto_dehumidifier_luftfuktighet
      # Dehumidifier tank-full detection via Shelly power signature.
      # Needed to graph the compressor cycle and tune the "full"
      # power band (see automations/avfuktare/). The switch state
      # tells full (fan-level W) apart from off (~0 W).
      - sensor.shellyplugsg3_e4b063f90d0c_effekt   # Otto inside - power
      - switch.shellyplugsg3_e4b063f90d0c          # Otto inside - plug on/off
      # When the outdoor unit gets its own Shelly plug, add it here:
      # - sensor.shellyplugsg3_XXXX_effekt
      # - switch.shellyplugsg3_XXXX
    exclude_entities:
      - homeassistant_state_change_total
