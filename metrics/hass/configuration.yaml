prometheus:
  filter:
    include_domains:
      - climate            # heat pumps / floor heat (automation targets, temp graphs)
      - humidifier         # dehumidifiers (price-driven)
    include_entities:
      # Electricity price (drives dehumidifier / heating / lamp automations)
      - sensor.nord_pool_se3_aktuellt_pris
      - sensor.nordpool_se3_inkl_skatt_o_nat
      # P1 whole-house meter (import current / power / energy)
      - sensor.p1_meter_strom_fas_*        # raw phase current (fuse loop input)
      - sensor.p1_fas_*_filtrerad          # 20s filtered phase current (fuse decision)
      - sensor.p1_meter_effekt
      - sensor.p1_meter_effekt_fas_*
      - sensor.p1_meter_total_elimport
      - sensor.p1_meter_total_elimport_cost
      # Zaptec EV charger (fuse-protection loop + charging dashboard)
      - sensor.zag064494_*                 # current, power, energy, status, volt, temp
      - sensor.zaptec_strom_fas_*_filtrerad  # filtered charger current (entity id is zaptec_*, not zag*)
      - number.zag064494_max_laddstrom     # control output (current cap)
      - number.zag064494_min_laddstrom
      - input_boolean.zaptec_fuse_paused   # fuse-stop latch (debug the flap logic)
      # Per-device power + energy (Energy Usage / Unknown Usage accounting).
      # Unknown Usage = total import minus every other energy meter, so the
      # whole *_energi set must stay exported or its load drifts into Unknown.
      - sensor.*_effekt
      - sensor.*_effekt_*
      - sensor.*_energi
      - sensor.*_energi_*
      - sensor.*_aterford_energi
      # Heat pump energy + temps (Energy Usage targets + outdoor-temp panel)
      - sensor.daikinap*_climatecontrol_arlig_energiforbrukning_for_*
      - sensor.daikinap*_climatecontrol_*temperatur
      - sensor.daikinap24848_energiforbrukning
      - sensor.daikinap24848_innetemperatur
      - sensor.daikinap24848_utetemperatur
      # Dehumidifier (tank-full alarm signals). Shelly power sensors ride
      # the sensor.*_effekt wildcard above; the plug switches need an
      # explicit line each (switch.* is not wildcarded).
      - sensor.avfuktare_luftfuktighet
      - sensor.otto_dehumidifier_luftfuktighet
      - binary_sensor.otto_dehumidifier_tank_full
      - switch.shellyplugsg3_e4b063f90d0c    # Otto (inneförråd)
      - switch.uteforrad_plug_avfuktare_uteforrad    # uteförråd
      - fan.otto_dehumidifier
      # Indoor climate (cheap, nice for graphs - optional)
      - sensor.z_wave_device_multichannel_*_temperatur
      - sensor.z_wave_device_multichannel_*_luftfuktighet
      - sensor.fibaro_motion_sensor_zw5_temperatur
    exclude_entities:
      - homeassistant_state_change_total
