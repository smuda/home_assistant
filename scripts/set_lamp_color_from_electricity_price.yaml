# Colors are rgbww (r, g, b, cold-white, warm-white) to match the WiZ
# bulbs' native color mode. Sending plain rgbw would force HA to do a
# lossy conversion. White channels are 0 so the status colors stay fully
# saturated and easy to tell apart.
variables:
  green:
    - 0
    - 255
    - 0
    - 0
    - 0
  yellow:
    - 236
    - 255
    - 0
    - 0
    - 0
  orange:
    - 255
    - 125
    - 0
    - 0
    - 0
  red:
    - 255
    - 0
    - 0
    - 0
    - 0
sequence:
  - action: light.turn_on
    metadata: {}
    data:
      brightness_pct: 30
      rgbww_color: >-
        {%- if states('sensor.nordpool_se3_inkl_skatt_o_nat') | float < 1.000 %}
        {{ green }}
        {%- elif states('sensor.nordpool_se3_inkl_skatt_o_nat') | float < 1.500 %}
        {{ yellow }}
        {%- elif states('sensor.nordpool_se3_inkl_skatt_o_nat') | float < 2.500 %}
        {{ orange }}
        {%- else %}
        {{ red }}
        {%- endif %}
    target:
      entity_id:
        - light.wiz_kitchen_electricity_cost_lamp
        - light.wiz_basement_electricity_cost_lamp
fields: {}
alias: Set lamp color from electricity price
description: ""
