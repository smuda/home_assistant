version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
  - package-ecosystem: "gomod"
    directories:
      - "/metrics/grafana-dashboards/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    # One PR per dependency across all dashboard modules, not one per
    # directory.
    groups:
      grafana-dashboards:
        group-by: "dependency-name"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    ignore:
      # .sandcastle/guards.mts mirrors Sandcastle internals, so bump it
      # by hand and re-audit the guards.
      - dependency-name: "@ai-hero/sandcastle"
