# Stops the house battery discharging into the car in the optimiser's
# self-consumption windows (EMS mode raw 0): stored charge would be
# spent on the car. Holds it idle while the car charges: Stop on the
# forced charge/discharge command, then Forced mode on the EMS mode.
# Never fights the optimiser's External EMS (raw 3), which it uses to
# grid-charge or peak-shave: neither hold nor release writes while
# the raw mode is 3. Seen 2026-11-18: the optimiser rewrote External
# EMS + command raw 170 within ~10 s of every hold write, so the hold
# lost every round and only churned the registers. It also takes
# control back from our Forced mode by itself when its plan says so.
# Fuse headroom for its grid charge is the fuse guard's job now (it
# ignores that charge while the optimiser yields), not this one's.
# Capping the power limits (33046/33047) did not work either: the
# optimiser writes them itself (seen 2026-10-25, #10/#11).
# Order matters: the command select can sit at `Forced charge`, and
# Forced mode first would start a grid charge.
# The pause helper counts as held: a fuse-stop shows
# connected_finished, same as a full car, and releasing then would
# block the resume. Reads input_boolean.zaptec_fuse_paused, never
# writes it.
# Release writes only Self-consumption. External EMS needs a live
# heartbeat (13080 = 12 s) that the optimiser sets itself.
# Forced mode is only written once the raw command register reads
# 204 (0xCC, Stop): a silently skipped or refused Stop write must not
# turn into a grid charge. The raw sensor, not the select: the select
# maps unknown values to Stop. The select's write refreshes the raw
# sensor right after. See README.md.
id: "1792555200000"
alias: Battery hold while the car charges
description: >-
  Holds the house battery idle (Stop command, Forced mode) while the
  car charges or the fuse guard holds it paused, so the battery does
  not discharge into the car in self-consumption windows. Releases to
  Self-consumption mode otherwise. Writes nothing while the optimiser
  is in control (External EMS), so it never fights its grid charge.
mode: restart

triggers:
  - trigger: state
    entity_id: sensor.zag064494_laddstatus
  - trigger: state
    entity_id: input_boolean.zaptec_fuse_paused
  - trigger: state
    entity_id: input_boolean.zaptec_fuse_paused
    to: "off"
    for: "00:10:00"
  # The optimiser's window ended mid-charge: re-apply the hold. The
  # 30 s skips its own brief 0 -> 3 flips.
  - trigger: state
    entity_id: sensor.ems_mode_selection_raw
    to: "0"
    for: "00:00:30"
  # Hourly rewrite: a refused Modbus write is silent, and this also
  # covers an HA restart.
  - trigger: time_pattern
    minutes: 0

conditions:
  # A status blip must not release the battery mid-charge; keep the
  # last write. A longer outage releases, so the hold cannot stick
  # through the next day's solar.
  - condition: template
    value_template: >-
      {{ states('sensor.zag064494_laddstatus') not in ['unknown', 'unavailable']
         or (now() - states.sensor.zag064494_laddstatus.last_changed)
            .total_seconds() > 1800 }}

variables:
  hold_after_pause: 600 # s the hold is kept after the pause helper changes
  # Held past a resume: the guard resumed against the idle battery, and
  # laddstatus lags minutes behind in the cloud, so the guard does not
  # run until it reads connected_charging. Releasing then is unguarded.
  hold: >-
    {{ is_state('sensor.zag064494_laddstatus', 'connected_charging')
       or is_state('input_boolean.zaptec_fuse_paused', 'on')
       or (now() - states.input_boolean.zaptec_fuse_paused.last_changed)
          .total_seconds() < hold_after_pause }}

actions:
  # Three blind writes 30 s apart: the inverter refuses writes
  # transiently, HA skips an unavailable entity, and neither surfaces
  # an error. continue_on_error: a failed write must not skip the
  # next one.
  - repeat:
      count: 3
      sequence:
        # Live each iteration: a takeover between iterations stops
        # further writes. != so a Modbus blip still writes.
        - if: "{{ states('sensor.ems_mode_selection_raw') != '3' }}"
          then:
            - if: "{{ hold }}"
              then:
                - action: select.select_option
                  continue_on_error: true
                  target:
                    entity_id: select.battery_forced_charge_discharge
                  data:
                    option: Stop (default)
                - if: >-
                    {{ states('sensor.battery_forced_charge_discharge_cmd_raw')
                       == '204' }}
                  then:
                    - action: select.select_option
                      continue_on_error: true
                      target:
                        entity_id: select.ems_mode
                      data:
                        option: Forced mode
              else:
                - action: select.select_option
                  continue_on_error: true
                  target:
                    entity_id: select.ems_mode
                  data:
                    option: Self-consumption mode (default)
        - delay:
            seconds: 30
