# Zaptec dynamic fuse protection (deadband + rate-limited)
# Changes the charge current RARELY to avoid the vehicle aborting
# the session. Zaptec recommends updating no more than once every
# 15 minutes; frequent changes can make the car (e.g. VW ID.4) drop
# the charge. A near-fuse reading still triggers an immediate safety
# cut. As a LAST RESORT, when even the 6 A minimum will not fit under
# the fuse, it stops the car (a controlled stop is less harmful than
# tripping the whole-house main fuse) and resumes when load drops. The
# stop needs must_stop to hold for stop_confirm; the emergency cut
# stays immediate. See README.md, "Stop confirmation". A charge
# resumed from outside HA while paused clears the pause, so the guard
# can stop or limit the car again.
# Raises larger than ramp_step go in ramp_step steps ramp_interval
# apart (a ramp), the one exception to the 15-min rule. See
# README.md, "Ramp".
# IMPORTANT: writes the charge current only while actually charging
# (connected_charging), plus the Floor start while disconnected (see
# README.md, "Do not disturb Eco Mode"). It never writes while merely
# waiting (connected_requesting), because writing the charger current
# overrides Zaptec's load balancer and is assumed to suspend Eco Mode
# - touching it while Eco is waiting makes the car charge immediately
# instead of at the cheap night hours. Eco decides WHEN; the guard
# limits the current once a charge is under way and otherwise only
# sets the Floor start while unplugged.
# Ignores the house battery's grid charge while the optimiser yields
# to the fuse, and counts it as load again on a sustained P1
# overload. Reads the EMS mode and command from the held copies in
# templates/sungrow_ems_held.yaml.
# Requires helpers: input_boolean.zaptec_fuse_paused,
# input_boolean.zaptec_fuse_stop_pending and
# input_boolean.zaptec_fuse_ramping. See README.md.
id: "1781429136630"
alias: Zaptec dynamic fuse protection (charge current)
description: >-
  Limits Zaptec max charge current so no phase exceeds the main
  fuse. Uses a deadband and a minimum interval between changes so
  current is adjusted infrequently (vehicles abort on too-frequent
  changes). A phase nearing the fuse forces an immediate reduction.
  Raises of more than ramp_step are ramped in steps so the optimiser
  has time to make room; cuts stay immediate.
  Normally floors at 6 A rather than stopping; only when even 6 A
  would still breach the fuse does it stop the car, resuming
  automatically once household load falls. A stop needs the
  must-stop condition to hold for stop_confirm (see README.md); the
  emergency cut does not wait. Writes while charging, plus a Floor
  start (6 A) once unplugged; never while the car waits, so it does
  not disturb Zaptec Eco Mode scheduling. Ignores the battery's grid
  charge while the 1KOMMA5 optimiser is in control and yielding;
  counts it as household load again on a sustained P1 overload. A
  charge resumed from outside HA clears the pause, so the guard can
  stop or limit the car again.
mode: single
max_exceeded: silent

triggers:
  - trigger: time_pattern
    minutes: "/1"
  - trigger: state
    entity_id: sensor.zag064494_laddstatus
    for: "00:00:10"
  # Wake fast on a raw surge; the decision logic below uses the
  # filtered values, so a spurious spike here cannot cause a stop.
  - trigger: numeric_state
    entity_id:
      - sensor.p1_meter_strom_fas_1
      - sensor.p1_meter_strom_fas_2
      - sensor.p1_meter_strom_fas_3
    above: 23
  # Act at once when the optimiser fails to yield, not at the next
  # minute tick.
  - trigger: state
    entity_id: binary_sensor.p1_sustained_overload
    to: "on"
  # Wake the guard when the stop confirmation runs out; the other
  # triggers may not fire in that window. The literal must equal
  # stop_confirm.
  - trigger: state
    entity_id: input_boolean.zaptec_fuse_stop_pending
    to: "on"
    for: "00:00:20"
    id: stop_confirm

conditions:
  # Run only while actually charging, or while we hold a fuse-pause
  # (so we can evaluate resume), or while a stop is pending (so a run
  # after charging ended still clears the timer), or while
  # disconnected with max_laddstrom not at ev_min (Floor start). Never
  # while connected_requesting - touching the charger then would
  # suspend Eco Mode.
  - condition: template
    value_template: "{{ charging or is_paused or stop_pending or floor_wanted }}"

variables:
  fuse: 25  # main fuse, amps per phase
  margin: 3  # safety headroom, amps
  deadband: 3  # min amps difference before changing
  min_interval: 900  # min seconds between normal changes (>= 15 min)
  ramp_step: 4  # largest raise in one write, amps
  ramp_interval: 115  # min s between ramp steps
  emergency_phase: 24  # any phase at/above this -> immediate cut
  resume_hyst: 6  # extra amps load must fall before resuming (widened to damp flap)
  resume_min_hold: 300  # min seconds a fuse-stop is held before resume is allowed
  restop_lockout: 30  # min seconds after a resume before another stop is allowed
  stop_confirm: 20  # s must_stop must hold before a last-resort stop
  ev_min: 6  # Zaptec Go minimum charge current
  floor_start_delay: 60  # s disconnected before the Floor start write
  ev_max: 16  # installer hardware cap
  max_age: 60  # P1 data older than this (s) is treated as a dropout
  failsafe_other: 18  # assumed other-phase load (A) when P1 is dead
  batt_max_w: 10000  # SH10RT battery charge rating, caps a bad reading
  nominal_v: 230  # battery W -> per-phase A (SH10RT charges all three phases evenly)
  current_max: "{{ states('number.zag064494_max_laddstrom')|int(0) }}"
  # Charger current: raw, never filtered. The Zaptec sensor updates
  # only every few minutes (cloud), and a `filter` sensor recomputes
  # only on a source update, so a filtered value shows the PREVIOUS
  # reading: 0 A for minutes after a charge starts, which reads the
  # car's own current as household load and forces a false fuse-stop.
  # Capped at the commanded max: the car cannot draw more, so a raw
  # reading stuck high after a reduction cannot hide household load.
  c1: "{{ [ states('sensor.zag064494_strom_fas_1')|float(0), current_max ]|min }}"
  c2: "{{ [ states('sensor.zag064494_strom_fas_2')|float(0), current_max ]|min }}"
  c3: "{{ [ states('sensor.zag064494_strom_fas_3')|float(0), current_max ]|min }}"
  cap: "{{ fuse - margin }}"
  # P1 liveness from the RAW meter. Use last_reported (advances on
  # every meter push, even an unchanged value) so a steady load is
  # not mistaken for a dead feed. The filtered sensor can sit
  # numeric-but-frozen if its source dies, so it is never trusted on
  # its own.
  live1: "{{ states('sensor.p1_meter_strom_fas_1') not in ['unknown','unavailable'] and (now() - states.sensor.p1_meter_strom_fas_1.last_reported).total_seconds() < max_age }}"
  live2: "{{ states('sensor.p1_meter_strom_fas_2') not in ['unknown','unavailable'] and (now() - states.sensor.p1_meter_strom_fas_2.last_reported).total_seconds() < max_age }}"
  live3: "{{ states('sensor.p1_meter_strom_fas_3') not in ['unknown','unavailable'] and (now() - states.sensor.p1_meter_strom_fas_3.last_reported).total_seconds() < max_age }}"
  # Decision value per phase: filtered (spike-smoothed) when present,
  # else the raw meter.
  v1: "{{ states('sensor.p1_fas_1_filtrerad') if states('sensor.p1_fas_1_filtrerad') not in ['unknown','unavailable'] else states('sensor.p1_meter_strom_fas_1') }}"
  v2: "{{ states('sensor.p1_fas_2_filtrerad') if states('sensor.p1_fas_2_filtrerad') not in ['unknown','unavailable'] else states('sensor.p1_meter_strom_fas_2') }}"
  v3: "{{ states('sensor.p1_fas_3_filtrerad') if states('sensor.p1_fas_3_filtrerad') not in ['unknown','unavailable'] else states('sensor.p1_meter_strom_fas_3') }}"
  # Optimiser grid-charging (External EMS, command raw 170), read from
  # the held copies (templates/sungrow_ems_held.yaml) that ride
  # through failed Modbus reads. The sustained-overload sensor checks
  # that it yields; is_state(..., 'off') gives no discount when that
  # sensor is unavailable, unknown or missing (fail safe). Relies on
  # External EMS stopping on a lapsed heartbeat (13080 = 12 s): if the
  # Heartbeat box dies, the mode leaves 3 and the discount ends. 230 V
  # nominal and AC-side losses put the estimate below the real grid
  # draw, the safe side.
  optimiser_charging: >-
    {{ is_state('sensor.ems_mode_selection_raw_held', '3')
       and is_state('sensor.battery_forced_charge_discharge_cmd_raw_held', '170')
       and is_state('binary_sensor.p1_sustained_overload', 'off') }}
  batt_a: >-
    {{ ([ [ states('sensor.battery_charging_power')|float(0), 0 ]|max,
          batt_max_w ]|min / 3 / nominal_v) if optimiser_charging else 0 }}
  # Other (non-car, non-yielding-battery) load per phase. When the P1
  # feed is dead, fail SAFE to failsafe_other so the car floors to
  # 6 A -- never read a dropout as zero load, which would let it allow
  # the full 16 A.
  o1: "{{ [ v1|float(0) - c1 - batt_a, 0 ]|max if live1 else failsafe_other }}"
  o2: "{{ [ v2|float(0) - c2 - batt_a, 0 ]|max if live2 else failsafe_other }}"
  o3: "{{ [ v3|float(0) - c3 - batt_a, 0 ]|max if live3 else failsafe_other }}"
  other_max: "{{ [o1, o2, o3]|max }}"
  # Lowest per-phase headroom against the (fuse - margin) cap.
  headroom: "{{ [ cap - o1, cap - o2, cap - o3 ]|min }}"
  raw_target: "{{ [ [ headroom|int(0), ev_max ]|min, ev_min ]|max }}"
  delta: "{{ raw_target - current_max }}"
  secs_since: >-
    {{ (now() - states.number.zag064494_max_laddstrom.last_changed)
       .total_seconds() }}
  # Phase total (other + car) for the near-fuse emergency cut. Excludes
  # the yielding optimiser charge, so it is not the real P1 total then.
  ptot_max: "{{ [ o1 + c1, o2 + c2, o3 + c3 ]|max }}"
  emergency: "{{ ptot_max >= emergency_phase }}"
  status: "{{ states('sensor.zag064494_laddstatus') }}"
  # Floor start, see README.md, "Do not disturb Eco Mode".
  floor_wanted: >-
    {{ status == 'disconnected'
       and states('number.zag064494_max_laddstrom')|is_number
       and current_max != ev_min }}
  secs_disconnected: >-
    {{ (now() - states.sensor.zag064494_laddstatus.last_changed)
       .total_seconds() if status == 'disconnected' else 0 }}
  floor_start_due: "{{ floor_wanted and secs_disconnected >= floor_start_delay }}"
  is_paused: "{{ is_state('input_boolean.zaptec_fuse_paused', 'on') }}"
  # input_boolean flips on=stop / off=resume, so its last_changed IS the
  # timestamp of the last stop/resume. When paused this is time-in-pause;
  # when not paused it is time-since-resume. No new helper needed.
  secs_since_pause: >-
    {{ (now() - states.input_boolean.zaptec_fuse_paused.last_changed)
       .total_seconds() }}
  # Stop-confirmation timer: its last_changed is when must_stop first
  # held (see helpers/input_boolean/zaptec_fuse_stop_pending.yaml).
  stop_pending: "{{ is_state('input_boolean.zaptec_fuse_stop_pending', 'on') }}"
  secs_pending: >-
    {{ (now() - states.input_boolean.zaptec_fuse_stop_pending.last_changed)
       .total_seconds() if stop_pending else 0 }}
  # Only "actually charging" - NOT connected_requesting. Writing during
  # requesting (Eco waiting) would suspend Eco and start charging now.
  charging: "{{ status == 'connected_charging' }}"
  # Ramp state, see README.md, "Ramp". `and` short-circuits, so the
  # unguarded last_changed reads only run while the flag is on.
  ramping: "{{ is_state('input_boolean.zaptec_fuse_ramping', 'on') }}"
  # A flag older than laddstatus belongs to an earlier session (or one
  # interrupted by a status change), so it is ignored.
  ramp_live: >-
    {{ ramping
       and states.sensor.zag064494_laddstatus is not none
       and states.input_boolean.zaptec_fuse_ramping.last_changed
           > states.sensor.zag064494_laddstatus.last_changed }}
  # The charger's phase sensors have reported since the last write to
  # max_laddstrom (they update only every ~2 min). A missing sensor
  # counts as fresh: reading .last_reported on none would fail the
  # whole variables block, and ending the ramp is the safe direction.
  car_fresh: >-
    {{ ramp_live
       and (states.sensor.zag064494_strom_fas_1 is none
            or states.sensor.zag064494_strom_fas_1.last_reported
               > states.number.zag064494_max_laddstrom.last_changed)
       and (states.sensor.zag064494_strom_fas_2 is none
            or states.sensor.zag064494_strom_fas_2.last_reported
               > states.number.zag064494_max_laddstrom.last_changed)
       and (states.sensor.zag064494_strom_fas_3 is none
            or states.sensor.zag064494_strom_fas_3.last_reported
               > states.number.zag064494_max_laddstrom.last_changed) }}
  ramp_start: "{{ not ramp_live and delta > ramp_step and secs_since >= min_interval }}"
  # Next ramp step: deadband and min_interval do not apply.
  ramp_step_due: "{{ ramp_live and delta >= 1 and secs_since >= ramp_interval }}"
  # Every write is capped at one ramp_step above the current max,
  # counted from at least ev_min, and no write goes below ev_min
  # (6 A). A cut (raw_target below current_max) is unaffected.
  write_value: "{{ [ [ raw_target, [ current_max, ev_min ]|max + ramp_step ]|min, ev_min ]|max }}"
  # A charge resumed from outside HA while we hold a fuse pause.
  # laddstatus must have changed after the pause flag, which skips the
  # cloud lag after our own stop. See README.md, "Resumed outside HA".
  resumed_outside: >-
    {{ is_paused and charging
       and states.sensor.zag064494_laddstatus.last_changed
           > states.input_boolean.zaptec_fuse_paused.last_changed }}
  # Stop decision uses the lower of filtered and raw P1 per phase. Raw
  # falls with the car at once after a reduction, while filtered still
  # holds up to 20 s of the old car current and, against the capped c,
  # would read as household load; filtered still smooths a raw spike.
  s1: "{{ [ [ v1|float(0), states('sensor.p1_meter_strom_fas_1')|float(0) ]|min - c1 - batt_a, 0 ]|max if live1 else failsafe_other }}"
  s2: "{{ [ [ v2|float(0), states('sensor.p1_meter_strom_fas_2')|float(0) ]|min - c2 - batt_a, 0 ]|max if live2 else failsafe_other }}"
  s3: "{{ [ [ v3|float(0), states('sensor.p1_meter_strom_fas_3')|float(0) ]|min - c3 - batt_a, 0 ]|max if live3 else failsafe_other }}"
  # Even the 6 A minimum would push a phase to/over the fuse: the
  # car cannot help, so a controlled stop beats a tripped main fuse.
  must_stop: "{{ [s1, s2, s3]|max + ev_min >= fuse }}"
  # must_stop while the guard may act (charging, not already paused).
  stop_wanted: "{{ not is_paused and charging and must_stop }}"
  # The `for:` trigger and now()/last_changed use different clocks, so
  # the re-check can read 19.99 s; its own id counts as confirmed.
  # See README.md, "Stop confirmation".
  stop_confirmed: >-
    {{ stop_pending
       and (secs_pending >= stop_confirm
            or (trigger is defined and trigger.id is defined
                and trigger.id == 'stop_confirm')) }}
  # Resume only after load has fallen well below that (hysteresis).
  can_resume: "{{ other_max + ev_min <= fuse - resume_hyst }}"
  # Write a new max only on a meaningful change after the interval,
  # OR as an immediate reduction when a phase nears the fuse.
  do_write: >-
    {{ ((delta | abs) >= deadband and secs_since >= min_interval)
       or (delta <= -1 and emergency)
       or ramp_step_due }}
  ramp_end: >-
    {{ ramping
       and (not ramp_live or is_paused or not charging
            or (delta <= 0 and car_fresh)
            or (delta < 0 and do_write)) }}

actions:
  # Keep the confirmation timer in sync with stop_wanted. The
  # variables keep their run-start values: a timer started here has
  # secs_pending 0 this run.
  - if: "{{ stop_wanted and not stop_pending }}"
    then:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.zaptec_fuse_stop_pending
  - if: "{{ not stop_wanted and stop_pending }}"
    then:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.zaptec_fuse_stop_pending
  # Before the choose, so a stale flag is cleared before ramp_start
  # sets it again in the same run, giving it a fresh last_changed.
  - if: "{{ ramp_end }}"
    then:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.zaptec_fuse_ramping
  - choose:
      # Unplugged while paused: clear the stale pause flag at once,
      # and Floor start if it is due. Before the delay, the Floor
      # start branch below writes on a later run.
      - conditions:
          - condition: template
            value_template: "{{ is_paused and status == 'disconnected' }}"
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.zaptec_fuse_paused
          - if: "{{ floor_start_due }}"
            then:
              - action: number.set_value
                target:
                  entity_id: number.zag064494_max_laddstrom
                data:
                  value: "{{ ev_min }}"

      # Resumed outside HA: clear the flag only. See README.md,
      # "Resumed outside HA".
      - conditions:
          - condition: template
            value_template: "{{ resumed_outside }}"
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.zaptec_fuse_paused

      # Resume: we paused for the fuse and load has now dropped.
      - conditions:
          - condition: template
            value_template: >-
              {{ is_paused and can_resume and status != 'disconnected'
                 and secs_since_pause >= resume_min_hold }}
        sequence:
          - action: button.press
            target:
              entity_id: button.zag064494_ateruppta_laddning
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.zaptec_fuse_paused

      # Last resort: even 6 A will not fit under the fuse -> stop, once
      # must_stop has held for stop_confirm. While it is pending the
      # choose falls through, so the emergency cut below still fires
      # on the first evaluation.
      - conditions:
          - condition: template
            value_template: >-
              {{ stop_wanted and stop_confirmed
                 and secs_since_pause >= restop_lockout }}
        sequence:
          - action: button.press
            target:
              entity_id: button.zag064494_stoppa_laddning
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.zaptec_fuse_paused
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.zaptec_fuse_stop_pending
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.zaptec_fuse_ramping

      # Normal path: adjust max charge current within the fuse.
      - conditions:
          - condition: template
            value_template: "{{ not is_paused and charging and do_write }}"
        sequence:
          - action: number.set_value
            target:
              entity_id: number.zag064494_max_laddstrom
            data:
              value: "{{ write_value }}"
          - if: "{{ ramp_start }}"
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.zaptec_fuse_ramping

      # Floor start, see README.md, "Do not disturb Eco Mode".
      - conditions:
          - condition: template
            value_template: "{{ not is_paused and floor_start_due }}"
        sequence:
          - action: number.set_value
            target:
              entity_id: number.zag064494_max_laddstrom
            data:
              value: "{{ ev_min }}"
