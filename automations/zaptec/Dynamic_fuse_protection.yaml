# Zaptec dynamic fuse protection (deadband + rate-limited)
# Changes the charge current RARELY to avoid the vehicle aborting
# the session. Zaptec recommends updating no more than once every
# 15 minutes; frequent changes can make the car (e.g. VW ID.4) drop
# the charge. A near-fuse reading still triggers an immediate safety
# cut. As a LAST RESORT, when even the 6 A minimum will not fit under
# the fuse, it stops the car (a controlled stop is less harmful than
# tripping the whole-house main fuse) and resumes when load drops.
# IMPORTANT: only acts while actually charging (connected_charging).
# It never writes the charge current while the car is disconnected or
# merely waiting (connected_requesting), because writing the charger
# current overrides Zaptec's load balancer and suspends Eco Mode -
# touching it while Eco is waiting makes the car charge immediately
# instead of at the cheap night hours. Let Eco decide WHEN; this only
# limits the current once a charge is under way.
# Requires helper: input_boolean.zaptec_fuse_paused. See README.md.
id: "1781429136630"
alias: Zaptec dynamic fuse protection (charge current)
description: >-
  Limits Zaptec max charge current so no phase exceeds the main
  fuse. Uses a deadband and a minimum interval between changes so
  current is adjusted infrequently (vehicles abort on too-frequent
  changes). A phase nearing the fuse forces an immediate reduction.
  Normally floors at 6 A rather than stopping; only when even 6 A
  would still breach the fuse does it stop the car, resuming
  automatically once household load falls. Acts only while charging
  so it does not disturb Zaptec Eco Mode scheduling.
mode: single
max_exceeded: silent

triggers:
  - trigger: time_pattern
    minutes: "/1"
  - trigger: state
    entity_id: sensor.zag064494_laddstatus
    for: "00:00:10"
  # Wake fast on a raw surge; the decision logic below uses the
  # filtered values, so a spurious spike here cannot cause a stop.
  - trigger: numeric_state
    entity_id:
      - sensor.p1_meter_strom_fas_1
      - sensor.p1_meter_strom_fas_2
      - sensor.p1_meter_strom_fas_3
    above: 23

conditions:
  # Run only while actually charging, or while we hold a fuse-pause
  # (so we can evaluate resume). Never while disconnected or merely
  # requesting - touching the charger then would suspend Eco Mode.
  - condition: template
    value_template: "{{ charging or is_paused }}"

variables:
  fuse: 25 # main fuse, amps per phase
  margin: 3 # safety headroom, amps
  deadband: 3 # min amps difference before changing
  min_interval: 900 # min seconds between normal changes (>= 15 min)
  emergency_phase: 24 # any phase at/above this -> immediate cut
  resume_hyst: 6 # extra amps load must fall before resuming (widened to damp flap)
  resume_min_hold: 300 # min seconds a fuse-stop is held before resume is allowed
  restop_lockout: 30 # min seconds after a resume before another stop is allowed
  ev_min: 6 # Zaptec Go minimum charge current
  ev_max: 16 # installer hardware cap
  max_age: 60 # P1 data older than this (s) is treated as a dropout
  failsafe_other: 18 # assumed other-phase load (A) when P1 is dead
  # Charger current: filtered (20 s MA) when present, else raw. Filtering
  # the charger like the household keeps other_load stable through
  # stop/resume transients (both signals lag equally).
  c1: >-
    {{ (states('sensor.zaptec_strom_fas_1_filtrerad')
        if states('sensor.zaptec_strom_fas_1_filtrerad')
           not in ['unknown','unavailable']
        else states('sensor.zag064494_strom_fas_1'))|float(0) }}
  c2: >-
    {{ (states('sensor.zaptec_strom_fas_2_filtrerad')
        if states('sensor.zaptec_strom_fas_2_filtrerad')
           not in ['unknown','unavailable']
        else states('sensor.zag064494_strom_fas_2'))|float(0) }}
  c3: >-
    {{ (states('sensor.zaptec_strom_fas_3_filtrerad')
        if states('sensor.zaptec_strom_fas_3_filtrerad')
           not in ['unknown','unavailable']
        else states('sensor.zag064494_strom_fas_3'))|float(0) }}
  cap: "{{ fuse - margin }}"
  # P1 liveness from the RAW meter. Use last_reported (advances on
  # every meter push, even an unchanged value) so a steady load is
  # not mistaken for a dead feed. The filtered sensor can sit
  # numeric-but-frozen if its source dies, so it is never trusted on
  # its own.
  live1: "{{ states('sensor.p1_meter_strom_fas_1') not in ['unknown','unavailable'] and (now() - states.sensor.p1_meter_strom_fas_1.last_reported).total_seconds() < max_age }}"
  live2: "{{ states('sensor.p1_meter_strom_fas_2') not in ['unknown','unavailable'] and (now() - states.sensor.p1_meter_strom_fas_2.last_reported).total_seconds() < max_age }}"
  live3: "{{ states('sensor.p1_meter_strom_fas_3') not in ['unknown','unavailable'] and (now() - states.sensor.p1_meter_strom_fas_3.last_reported).total_seconds() < max_age }}"
  # Decision value per phase: filtered (spike-smoothed) when present,
  # else the raw meter.
  v1: "{{ states('sensor.p1_fas_1_filtrerad') if states('sensor.p1_fas_1_filtrerad') not in ['unknown','unavailable'] else states('sensor.p1_meter_strom_fas_1') }}"
  v2: "{{ states('sensor.p1_fas_2_filtrerad') if states('sensor.p1_fas_2_filtrerad') not in ['unknown','unavailable'] else states('sensor.p1_meter_strom_fas_2') }}"
  v3: "{{ states('sensor.p1_fas_3_filtrerad') if states('sensor.p1_fas_3_filtrerad') not in ['unknown','unavailable'] else states('sensor.p1_meter_strom_fas_3') }}"
  # Other (non-car) load per phase. When the P1 feed is dead, fail
  # SAFE to failsafe_other so the car floors to 6 A — never read a
  # dropout as zero load, which would let it allow the full 16 A.
  o1: "{{ [ v1|float(0) - c1, 0 ]|max if live1 else failsafe_other }}"
  o2: "{{ [ v2|float(0) - c2, 0 ]|max if live2 else failsafe_other }}"
  o3: "{{ [ v3|float(0) - c3, 0 ]|max if live3 else failsafe_other }}"
  other_max: "{{ [o1, o2, o3]|max }}"
  # Lowest per-phase headroom against the (fuse - margin) cap.
  headroom: "{{ [ cap - o1, cap - o2, cap - o3 ]|min }}"
  raw_target: "{{ [ [ headroom|int(0), ev_max ]|min, ev_min ]|max }}"
  current_max: "{{ states('number.zag064494_max_laddstrom')|int(0) }}"
  delta: "{{ raw_target - current_max }}"
  secs_since: >-
    {{ (now() - states.number.zag064494_max_laddstrom.last_changed)
       .total_seconds() }}
  # Real phase total (other + car) for the near-fuse emergency cut.
  ptot_max: "{{ [ o1 + c1, o2 + c2, o3 + c3 ]|max }}"
  emergency: "{{ ptot_max >= emergency_phase }}"
  status: "{{ states('sensor.zag064494_laddstatus') }}"
  is_paused: "{{ is_state('input_boolean.zaptec_fuse_paused', 'on') }}"
  # input_boolean flips on=stop / off=resume, so its last_changed IS the
  # timestamp of the last stop/resume. When paused this is time-in-pause;
  # when not paused it is time-since-resume. No new helper needed.
  secs_since_pause: >-
    {{ (now() - states.input_boolean.zaptec_fuse_paused.last_changed)
       .total_seconds() }}
  # Only "actually charging" - NOT connected_requesting. Acting during
  # requesting (Eco waiting) would suspend Eco and start charging now.
  charging: "{{ status == 'connected_charging' }}"
  # Even the 6 A minimum would push a phase to/over the fuse: the
  # car cannot help, so a controlled stop beats a tripped main fuse.
  must_stop: "{{ other_max + ev_min >= fuse }}"
  # Resume only after load has fallen well below that (hysteresis).
  can_resume: "{{ other_max + ev_min <= fuse - resume_hyst }}"
  # Write a new max only on a meaningful change after the interval,
  # OR as an immediate reduction when a phase nears the fuse.
  do_write: >-
    {{ ((delta | abs) >= deadband and secs_since >= min_interval)
       or (delta <= -1 and emergency) }}

actions:
  - choose:
      # Clear a stale pause flag once the car is unplugged. We do NOT
      # touch the charge current while disconnected (that would
      # suspend Eco Mode for the next session).
      - conditions:
          - condition: template
            value_template: "{{ is_paused and status == 'disconnected' }}"
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.zaptec_fuse_paused

      # Resume: we paused for the fuse and load has now dropped.
      - conditions:
          - condition: template
            value_template: >-
              {{ is_paused and can_resume and status != 'disconnected'
                 and secs_since_pause >= resume_min_hold }}
        sequence:
          - action: button.press
            target:
              entity_id: button.zag064494_ateruppta_laddning
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.zaptec_fuse_paused

      # Last resort: even 6 A will not fit under the fuse -> stop.
      - conditions:
          - condition: template
            value_template: >-
              {{ not is_paused and charging and must_stop
                 and secs_since_pause >= restop_lockout }}
        sequence:
          - action: button.press
            target:
              entity_id: button.zag064494_stoppa_laddning
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.zaptec_fuse_paused

      # Normal path: adjust max charge current within the fuse.
      - conditions:
          - condition: template
            value_template: "{{ not is_paused and charging and do_write }}"
        sequence:
          - action: number.set_value
            target:
              entity_id: number.zag064494_max_laddstrom
            data:
              value: "{{ raw_target }}"
