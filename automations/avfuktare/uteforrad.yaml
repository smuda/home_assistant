# Instans: avfuktaren i uteförrådet (fan.avfuktare / humidifier.avfuktare).
# =========================================================================
# use_tank_full_sensor är false - den här enheten har ingen tank_full-sensor
# (Tuyan "Avfuktare uteförråd" exponerar bara fläkt/fukt), så detektionen
# vilar helt på Shelly-effekten.
#
# OBS trösklar: full_power_max/running_power_min ärver Ottos verifierade
# värden. Kompressoreffekten på den här enheten kan skilja sig, så
# verifiera dem mot en riktig full-cykel på just uteförrådsenheten och
# justera vid behov.
id: "1783265791475"
alias: Avfuktare uteförråd full - notis
description: >-
  Larmar när avfuktaren i uteförrådet troligen är full, sett på
  Shelly-effekten. Ingen Tuya-sensor på den här enheten.
use_blueprint:
  path: smuda/tank_full_notify.blueprint.yaml
  input:
    name: Avfuktare uteförråd
    power_sensor: sensor.uteforrad_plug_avfuktare_uteforrad_effekt
    plug_switch: switch.uteforrad_plug_avfuktare_uteforrad
    full_power_max: 10
    low_duration:
      hours: 0
      minutes: 30
      seconds: 0
    running_power_min: 100
    use_price_gate: true
    price_sensor: sensor.nord_pool_se3_aktuellt_pris
    price_off_above: 1.0
    use_tank_full_sensor: false
    notify_services:
      - notify.parents
    reminder_hours: 6
    notify_when_emptied: false
