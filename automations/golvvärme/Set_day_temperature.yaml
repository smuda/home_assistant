id: "1761705768278"
alias: "shower floor heating: Set day temperature"
description: ""
triggers:
  - trigger: time
    at: "06:00:00"
conditions:
  # Only on working days (Mon-Fri minus Swedish holidays), via Workday.
  - condition: state
    entity_id: binary_sensor.workday_sensor_se
    state: "on"
actions:
  - action: climate.set_temperature
    target:
      entity_id: climate.golvvarmen
    data:
      temperature: 20
mode: single
