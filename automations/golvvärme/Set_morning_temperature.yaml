id: "1761705616537"
alias: "shower floor heating: Set morning temperature"
description: ""
triggers:
  - trigger: time
    at: "03:00:00"
conditions:
  # Only on working days (Mon-Fri minus Swedish holidays), via Workday.
  - condition: state
    entity_id: binary_sensor.workday_sensor_se
    state: "on"
actions:
  - action: climate.set_temperature
    target:
      entity_id: climate.golvvarmen
    data:
      temperature: "24"
      hvac_mode: heat
mode: single
